name: Build APK
on:
  push:
    branches: [main, apk-test]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: unzip -oq android.zip -d apkbuild && bash apkbuild/build.sh
      - if: github.ref == 'refs/heads/main'
        run: |
          gh release delete app -y --cleanup-tag || true
          gh release create app Fretwork.apk --title "Fretwork app" --notes "Tap Fretwork.apk to download, then open it to install."
        env:
          GH_TOKEN: ${{ github.token }}
